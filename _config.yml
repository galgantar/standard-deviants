# Beautiful Jekyll configuration

# Site settings
title: Toxic Stew
author: Standard Deviants Team
description: A cookbook on how to go viral on Reddit
baseurl: ""
url: ""

# Avatar / Profile picture (can be a local path or URL)
# avatar: "/assets/img/avatar-icon.png"

# Navigation bar links
navbar-links:
  GitHub Repo: "https://github.com/epfl-ada/ada-2025-project-standard-deviants-ada"
  Datasets:
    - SNAP Reddit Hyperlinks: "https://snap.stanford.edu/data/soc-RedditHyperlinks.html"
    - SNAP Reddit Embeddings: "https://snap.stanford.edu/data/web-RedditEmbeddings.html"

# Social media links (optional)
# Uncomment and add your handles
# social-network-links:
#   email: "your-email@example.com"
#   github: standard-deviants
#   twitter: yourusername
#   linkedin: yourprofile

# Theme settings
theme: beautiful-jekyll-theme

# Excerpt word length
excerpt_length: 50

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from processing
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
